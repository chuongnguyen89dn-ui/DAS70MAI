name: iOS Build

on:
  push:
    branches: [feature-dual-source, feature-xadas-native-rtsp]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Download YOLO model for offline runtime
        run: |
          set -euxo pipefail
          mkdir -p DAS70MAI/Models
          curl -fL --retry 3 -o "$RUNNER_TEMP/yolo26n.zip" https://github.com/ultralytics/yolo-ios-app/releases/download/v8.3.0/yolo26n.mlpackage.zip
          unzip -q "$RUNNER_TEMP/yolo26n.zip" -d "$RUNNER_TEMP/yolo-model"
          MODEL=$(find "$RUNNER_TEMP/yolo-model" -name '*.mlpackage' -type d | head -1)
          test -n "$MODEL"
          cp -R "$MODEL" DAS70MAI/Models/yolo26n.mlpackage
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project DAS70MAI.xcodeproj -scheme DAS70MAI -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -project DAS70MAI.xcodeproj -scheme DAS70MAI -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DAS70MAI-Device" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify bundled YOLO model
        run: |
          APP="$RUNNER_TEMP/DAS70MAI-Device/Build/Products/Release-iphoneos/DAS70MAI.app"
          test -d "$APP"
          find "$APP" -iname '*yolo26n*' -print | tee "$RUNNER_TEMP/model-files.txt"
          test -s "$RUNNER_TEMP/model-files.txt"
      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DAS70MAI-Device/Build/Products/Release-iphoneos/DAS70MAI.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/DAS70MAI-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/DAS70MAI-unsigned.ipa"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DAS70MAI-unsigned-ipa
          path: DAS70MAI-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
