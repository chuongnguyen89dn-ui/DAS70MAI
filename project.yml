name: DAS70MAI
options:
  bundleIdPrefix: com.das70mai
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
packages:
  VLCKit:
    url: https://github.com/videolan/vlckit.git
    branch: master
targets:
  DAS70MAI:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ConnectionOnly
    dependencies:
      - package: VLCKit
        product: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.das70mai.connectiontest
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DAS70MAI Connect
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: DAS70MAI connects directly to the 70mai A500S camera on its local Wi-Fi network.
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
