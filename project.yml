name: DAS70MAI
options:
  bundleIdPrefix: com.das70mai
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
packages:
  UltralyticsYOLO:
    url: https://github.com/ultralytics/yolo-ios-app.git
    from: 8.9.4
  VLCKit:
    url: https://github.com/videolan/vlckit.git
    branch: master
targets:
  DAS70MAI:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DAS70MAI
    dependencies:
      - package: UltralyticsYOLO
        product: UltralyticsYOLO
      - package: VLCKit
        product: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.das70mai.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DAS70MAI
        INFOPLIST_KEY_NSCameraUsageDescription: DAS70MAI uses the rear iPhone camera as a manually selected ADAS test source.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: DAS70MAI connects to a manually selected 70mai A500S camera on the local network.
        INFOPLIST_KEY_SeventyMaiToken: "$(SEVENTYMAI_TOKEN)"
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
