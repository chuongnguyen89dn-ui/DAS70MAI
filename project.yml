name: xADAS-iOS
options:
  bundleIdPrefix: com.hmtnvac
  deploymentTarget:
    iOS: "16.0"
packages:
  ONNXRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager.git
    exactVersion: 1.20.0
  UltralyticsYOLO:
    url: https://github.com/ultralytics/yolo-ios-app.git
    from: 8.9.4
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  xADAS-iOS:
    type: application
    platform: iOS
    sources:
      - path: xADAS-iOS
        excludes:
          - Camera/SeventyMaiPlayerView.swift
    dependencies:
      - package: ONNXRuntime
        product: onnxruntime
      - package: UltralyticsYOLO
        product: UltralyticsYOLO
    info:
      path: xADAS-iOS/Info.plist
      properties:
        CFBundleDisplayName: "DAS70MAI"
        CFBundleName: "DAS70MAI"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SeventyMaiToken: "__SEVENTYMAI_TOKEN__"
        GraphHopperAPIKey: "__GRAPHHOPPER_API_KEY__"
        NSCameraUsageDescription: "DAS70MAI uses the camera for real-time driver-assistance vision processing."
        NSLocalNetworkUsageDescription: "DAS70MAI connects directly to your 70mai dashcam on its local Wi-Fi network to receive the RTSP video stream."
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: DAS70MAI
        PRODUCT_BUNDLE_IDENTIFIER: com.hmtnvac.xadas
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 100
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: xADAS-iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
